# Backend do Ramais, na vps-api: banco, migracao, api e worker.
# No Coolify: build pack "Docker Compose", arquivo /docker-compose.api.yml, proxy desligado e
# domínio VAZIO. Quem atende o domínio é o Caddy da vps-web.
#
# Convenção de portas da infra (ver docs/coolify.md): API em 3<n>06, front em 8<n>90, com n o
# índice do projeto. Metabioma 0, VoiceHealth 1, Central de Ramais 2, site HealthVentures 3.
# O Ramais é o 4: API 3406 aqui, web 8490 na vps-web.
#
# A API é publicada SÓ no IP do Tailscale. Quem fala com ela é o nginx da web (outro recurso:
# apps/web/Dockerfile, API_UPSTREAM=http://100.100.212.18:3406). Por ele chegam o navegador, o
# webhook da Meta e o WebSocket. O banco não publica porta nenhuma.
#
# Diferenças para o docker-compose.yml (máquina local):
#   - Toda variável que a api e o worker leem está listada em `environment` com ${VAR}: é assim
#     que o Coolify mostra cada uma na aba Environment Variables (ele não lê env_file).
#     Nenhuma usa `${VAR:-}`: o Coolify roda o `docker compose build` só com as variáveis marcadas
#     como Buildtime, e os segredos não são (nem devem ser). A falta de um segredo é barrada na
#     SUBIDA: o Postgres não inicia sem DB_SENHA_ADMIN, a migração recusa começar sem
#     DB_SENHA_OWNER/DB_SENHA_APP (e a api só sobe depois dela), e a api recusa subir sem
#     JWT_SEGREDO e os segredos da Meta (src/config.ts).
#   - `exclude_from_hc`: a migração roda e sai; não conta para a saúde da aplicação.
#     (Extensão do Coolify: o `docker compose` local recusa essa chave. Por isso o arquivo é outro.)
#   - Seed de demonstração só com SEED_DEMO=true (ver o serviço migracao).
#
# Não coloque NODE_ENV nas variáveis do Coolify: ele vira build arg e o build perderia as
# devDependencies (a imagem final já define NODE_ENV=production).

x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-banco-urls: &banco-urls
  DATABASE_URL: postgres://ramais_app:${DB_SENHA_APP:-}@banco:5432/ramais
  DATABASE_URL_OWNER: postgres://ramais_owner:${DB_SENHA_OWNER:-}@banco:5432/ramais

x-imagem-api: &imagem-api
  context: .
  dockerfile: apps/api/Dockerfile
  args:
    # O Coolify passa o commit do deploy; /saude devolve como `versao`.
    SOURCE_COMMIT: ${SOURCE_COMMIT:-}

x-ambiente-app: &ambiente-app
  <<: *banco-urls
  # Tem que bater com a porta publicada abaixo: o contêiner escuta na mesma porta do host.
  PORTA: ${API_PORT:-3406}
  # 32+ caracteres aleatórios. Trocar desloga todo mundo.
  JWT_SEGREDO: ${JWT_SEGREDO:-}
  # Endereço público (https://...). O QR do chat do quarto aponta para <WEB_URL_PUBLICA>/q/<código>.
  WEB_URL_PUBLICA: ${WEB_URL_PUBLICA:-}
  WEB_ORIGEM: ${WEB_URL_PUBLICA:-}

  # WhatsApp. Comece com true: nada vai para a Meta e dá para testar pelo simulador.
  META_DRY_RUN: ${META_DRY_RUN:-true}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
  META_TOKEN: ${META_TOKEN:-}
  META_API_VERSAO: ${META_API_VERSAO:-v23.0}

  # IA. Sem chave, roteia por palavras-chave e não traduz. Defaults = configuração B (docs/custos.md).
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  IA_MODELO_ROTEAMENTO: ${IA_MODELO_ROTEAMENTO:-typesafe/jev-1.13}
  IA_MODELO_ROTEAMENTO_ALTERNATIVO: ${IA_MODELO_ROTEAMENTO_ALTERNATIVO:-google/gemini-3.1-flash-lite}
  IA_MODELO_TRADUCAO: ${IA_MODELO_TRADUCAO:-google/gemini-2.5-flash-lite}
  IA_MODELO_TRADUCAO_ALTERNATIVO: ${IA_MODELO_TRADUCAO_ALTERNATIVO:-google/gemini-3.1-flash-lite}
  IA_MODELO_RESPOSTA: ${IA_MODELO_RESPOSTA:-google/gemini-2.5-flash-lite}
  IA_MODELO_MULTIMODAL: ${IA_MODELO_MULTIMODAL:-google/gemini-3.1-flash-lite}
  IA_CONFIANCA: ${IA_CONFIANCA:-autoconsistencia}
  IA_AMOSTRAS: ${IA_AMOSTRAS:-3}
  IA_SEM_RETENCAO: ${IA_SEM_RETENCAO:-true}
  IA_PIVOT_INGLES: ${IA_PIVOT_INGLES:-true}

  # Mídia: `local` usa o volume abaixo; `s3` exige bucket e credenciais da AWS.
  ARMAZENAMENTO: ${ARMAZENAMENTO:-local}
  ARMAZENAMENTO_DIR: /dados/armazenamento
  S3_BUCKET: ${S3_BUCKET:-}
  AWS_REGION: ${AWS_REGION:-sa-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

  # Push do app da equipe (FCM). Vazio = notificações só no log.
  FCM_CONTA_SERVICO_B64: ${FCM_CONTA_SERVICO_B64:-}

  # Notificação no navegador (Web Push): equipe na web e hóspede no chat do quarto. Vazio = desligado.
  # Gerar: pnpm --filter @ramais/api vapid
  VAPID_PUBLICA: ${VAPID_PUBLICA:-}
  VAPID_PRIVADA: ${VAPID_PRIVADA:-}
  VAPID_CONTATO: ${VAPID_CONTATO:-mailto:contato@ramais.com.br}

services:
  banco:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logs
    environment:
      POSTGRES_PASSWORD: ${DB_SENHA_ADMIN:-}
    volumes:
      # Postgres 18 guarda os dados em /var/lib/postgresql/18/docker: o volume vai no pai.
      - banco:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  migracao:
    build:
      <<: *imagem-api
      target: migracao
    exclude_from_hc: true
    restart: "no"
    logging: *logs
    # SEED_DEMO=true carrega o Hotel Piloto de desenvolvimento (idempotente). Ainda não há outro jeito de
    # criar a primeira organização e o primeiro admin. As contas do seed têm senha CONHECIDA
    # (tools/seed/dados.ts): troque a do admin no primeiro acesso e volte SEED_DEMO para false.
    command:
      - sh
      - -c
      - >-
        [ -n "$$DB_SENHA_OWNER" ] && [ -n "$$DB_SENHA_APP" ]
        || { echo "defina DB_SENHA_OWNER e DB_SENHA_APP nas variáveis do recurso"; exit 1; };
        pnpm db:setup && pnpm db:migrate
        && if [ "$$SEED_DEMO" = true ]; then pnpm db:seed; fi
        && if [ -n "$$DEMO_SENHA" ]; then pnpm --filter @ramais/seed demo; fi
    environment:
      <<: *banco-urls
      DATABASE_URL_ADMIN: postgres://postgres:${DB_SENHA_ADMIN:-}@banco:5432/postgres
      DB_SENHA_OWNER: ${DB_SENHA_OWNER:-}
      DB_SENHA_APP: ${DB_SENHA_APP:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      # Com valor, cria o hotel de demonstração (tools/seed/demo.ts), uma vez só; todos os logins
      # dele usam esta senha. Vazia, não faz nada.
      DEMO_SENHA: ${DEMO_SENHA:-}
    depends_on:
      banco:
        condition: service_healthy

  api:
    build:
      <<: *imagem-api
      target: api
    restart: unless-stopped
    logging: *logs
    environment: *ambiente-app
    # O IP é OBRIGATÓRIO: sem ele o Docker publica em 0.0.0.0 e passa por cima do ufw.
    # Depois de subir, `ss -tlnp` na vps-api tem que mostrar 3406 só neste IP.
    ports:
      - "${TAILNET_IP:-100.100.212.18}:${API_PORT:-3406}:${API_PORT:-3406}"
    volumes:
      - armazenamento:/dados/armazenamento
    depends_on:
      migracao:
        condition: service_completed_successfully

  worker:
    build:
      <<: *imagem-api
      target: api
    restart: unless-stopped
    logging: *logs
    command: ["node", "--enable-source-maps", "dist/main.worker.js"]
    environment: *ambiente-app
    volumes:
      - armazenamento:/dados/armazenamento
    # Sem HTTP: o healthcheck da imagem (GET /saude) não se aplica.
    healthcheck:
      disable: true
    depends_on:
      migracao:
        condition: service_completed_successfully

volumes:
  banco:
  # Fotos e áudios (ARMAZENAMENTO=local), compartilhados entre api e worker. Entra no backup.
  armazenamento:
